# Server Config
server.port=8080

# Monitoreo (Actuator & Prometheus)
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.prometheus.enabled=true
management.metrics.export.prometheus.enabled=true
management.metrics.tags.application=shidell

# File uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Security session signing secret (override in production via SHIDELL_SESSION_SECRET)
shidell.session.secret=${SHIDELL_SESSION_SECRET:shidell-local-session-secret-v1}

# PostgreSQL Data Source Config
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/demo1}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:Joseelmer31}
spring.datasource.driver-class-name=org.postgresql.Driver

# ── HikariCP Connection Pool Tuning (Bajo consumo de conexiones) ──
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=4
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=1800000
spring.datasource.hikari.connection-timeout=20000

# ── Hibernate & JPA Config ──
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Desactivar open-in-view para liberar conexiones de BD inmediatamente
spring.jpa.open-in-view=false

# Hibernate JDBC Batching para inserciones y actualizaciones en lote
spring.jpa.properties.hibernate.jdbc.batch_size=25
spring.jpa.properties.hibernate.order_inserts=true
spring.jpa.properties.hibernate.order_updates=true

# ── Compresión HTTP GZIP (Ahorro de 70-80% en transferencia de bytes) ──
server.compression.enabled=true
server.compression.min-response-size=1024
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json

# ── Caché HTTP del Navegador para Recursos Estáticos (Assets) ──
spring.web.resources.cache.period=86400
spring.web.resources.chain.cache=true

# Logging Config (Show only errors and important info)
logging.level.root=INFO
logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR
