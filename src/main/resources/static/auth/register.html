<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/vendor/shidell-theme.js?v=20261114d"></script>
    <title>Shidell - Registro</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <link rel="stylesheet" href="/vendor/shidell-modern-system.css?v=20261114m3">
    <link rel="stylesheet" href="../plataformaestudiante/css/styles.css?v=20261114m3">
    <link rel="stylesheet" href="auth-modern.css?v=20261114m3">
</head>
<body>
    <div class="auth-page">
        <div class="auth-left">
            <div class="auth-card">
                <div class="auth-header">
                    <div class="auth-logo"><i class="ph-fill ph-user-plus"></i></div>
                    <h1>Crear cuenta</h1>
                    <p>Registra tus datos para acceder al portal Shidell.</p>
                </div>

                <form class="auth-form" id="registerForm">
                    <div class="form-group">
                        <label for="nombres">Nombres</label>
                        <div class="input-wrapper">
                            <i class="ph ph-user"></i>
                            <input id="nombres" required>
                            <span class="input-focus-beam"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="apellidos">Apellidos</label>
                        <div class="input-wrapper">
                            <i class="ph ph-identification-card"></i>
                            <input id="apellidos" required>
                            <span class="input-focus-beam"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="email">Correo electrónico</label>
                        <div class="input-wrapper">
                            <i class="ph ph-envelope"></i>
                            <input type="email" id="email" class="has-trailing-control" required>
                            <span id="email-valid-badge" class="input-valid-badge" aria-hidden="true">
                                <i class="ph-fill ph-check-circle"></i>
                            </span>
                            <span class="input-focus-beam"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="password">Contraseña</label>
                        <div class="input-wrapper">
                            <i class="ph ph-lock"></i>
                            <input type="password" id="password" class="has-trailing-control" minlength="6" required>
                            <button type="button" id="toggle-password" class="toggle-password-btn" aria-label="Mostrar u ocultar contraseña" aria-pressed="false">
                                <i class="ph ph-eye"></i>
                            </button>
                            <span class="input-focus-beam"></span>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="rol">Rol</label>
                        <div class="input-wrapper">
                            <i class="ph ph-shield-check"></i>
                            <select id="rol" required>
                                <option value="">Elige rol</option>
                                <option value="ESTUDIANTE">Estudiante</option>
                                <option value="DOCENTE">Docente</option>
                                <option value="PADRE">Padre de familia</option>
                            </select>
                            <span class="input-focus-beam"></span>
                        </div>
                    </div>

                    <button type="submit" class="auth-btn">Registrarme</button>
                </form>

                <div class="auth-footer">
                    <p>¿Ya tienes una cuenta? <a href="login.html">Inicia sesión</a></p>
                </div>
            </div>
        </div>

        <div class="auth-right">
            <div class="decor-circle circle-1"></div>
            <div class="decor-circle circle-2"></div>
            <canvas id="auth-right-canvas" aria-hidden="true"></canvas>
            <div class="auth-right-content">
                <h2>Tu portal académico empieza aquí</h2>
                <p>Accede a cursos, tareas, calificaciones y comunicación interna desde un solo espacio.</p>
                <div class="auth-illustration">
                    <img src="https://img.icons8.com/color/240/student-registration.png" alt="registro educativo">
                </div>
            </div>
        </div>
    </div>

    <!-- SweetAlert2 para Alertas Elegantes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/vendor/alertas.js"></script>
    <script src="/vendor/mobile-shell.js?v=20261114m3"></script>
    <script src="/vendor/shidell-motion.js?v=20261114m3"></script>
    <script src="auth-motion.js?v=20261114m4"></script>

</body>
</html>
