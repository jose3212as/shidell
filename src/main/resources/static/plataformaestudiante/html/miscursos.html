        <!-- Main Wrapper -->

                    <p>Revisa tus materias, horarios de clase y avance académico.</p>

                        <div class="user-details">
                            <span class="user-name">Estudiante</span>
                            <a href="configuracion.html" style="text-decoration:none;"><span class="user-action">Ver perfil <img src="../icons/regular/caret-right.svg" class="icon-img" alt="caret-right"></span></a>
                        </div>

            <div class="content-area courses-page">
                <section class="courses-layout">

                            <h2>Cursos matriculados</h2>
                            <span id="courses-count">0 cursos</span>
                        </div>
                        <div class="courses-toolbar-controls">
                            <!-- Buscador rápido -->

                                <input type="text" id="courseSearch" placeholder="Buscar curso o docente..." oninput="filtrarCursos()" aria-label="Buscar curso o docente">
                                <button type="button" class="search-clear-btn" id="searchClearBtn" onclick="limpiarBusqueda()" title="Limpiar búsqueda" style="display:none;">✕</button>
                            </div>

                            <!-- Filtro de estado -->
                            <div class="course-status-filter">
                                <select id="courseStatusFilter" onchange="filtrarCursos()" aria-label="Filtrar por estado">
                                    <option value="todos">Todos los cursos</option>
                                    <option value="en-progreso">En curso</option>
                                    <option value="completado">Completados</option>
                                </select>
                            </div>

                            <!-- Selector de modo de vista: Cuadro o Lista -->
                            <div class="view-filter-wrapper">
                                <span class="view-filter-label">Vista:</span>
                                <div class="view-switcher" role="group" aria-label="Filtro de vista: Cuadro o Lista">
                                    <button type="button" class="view-toggle-btn active" id="btnViewCuadro" onclick="cambiarModoVista('cuadro')" title="Vista en cuadro (tarjetas)">
                                        <img src="../icons/regular/squares-four.svg" class="icon-img" alt="cuadro">
                                        <span>Cuadro</span>
                                    </button>
                                    <button type="button" class="view-toggle-btn" id="btnViewLista" onclick="cambiarModoVista('lista')" title="Vista en lista">

            </div>
        </main>

    <!-- Script Logic -->
    <script>
        let userCursos = {};
        const TOTAL_SEMANAS_LECTIVAS = 36;
        let cursosDetalle = [];
        let modoVista = localStorage.getItem('shidell_cursos_view_mode') || 'cuadro'; // 'cuadro' | 'lista'

        document.addEventListener('DOMContentLoaded', async () => {
            aplicarModoVistaUI(modoVista);

            userCursos = await window.shidellSession?.obtenerUsuario() 
                || JSON.parse(localStorage.getItem('shidell_user') || 'null') 
                || {};

            document.querySelectorAll('.user-name').forEach(el => {
                el.textContent = `${userCursos.nombres || ''} ${userCursos.apellidos || ''}`.trim() || 'Estudiante';
            });

            await loadCursos();
        });

        function cambiarModoVista(modo) {
            if (modo !== 'cuadro' && modo !== 'lista') modo = 'cuadro';
            modoVista = modo;
            localStorage.setItem('shidell_cursos_view_mode', modo);
            aplicarModoVistaUI(modo);
            renderCursos();
        }

        function aplicarModoVistaUI(modo) {
            const btnCuadro = document.getElementById('btnViewCuadro');
            const btnLista = document.getElementById('btnViewLista');
            if (btnCuadro && btnLista) {
                if (modo === 'lista') {
                    btnCuadro.classList.remove('active');
                    btnLista.classList.add('active');
                } else {
                    btnCuadro.classList.add('active');
                    btnLista.classList.remove('active');
                }
            }
        }

        function limpiarBusqueda() {
            const searchInput = document.getElementById('courseSearch');
            if (searchInput) searchInput.value = '';
            filtrarCursos();
        }

        function filtrarCursos() {
            renderCursos();
        }

        function obtenerCursosFiltrados() {
            const searchInput = document.getElementById('courseSearch');
            const term = (searchInput ? searchInput.value : '').trim().toLowerCase();
            const clearBtn = document.getElementById('searchClearBtn');
            if (clearBtn) {
                clearBtn.style.display = term ? 'flex' : 'none';
            }

            const statusSelect = document.getElementById('courseStatusFilter');
            const statusVal = statusSelect ? statusSelect.value : 'todos';

            return cursosDetalle.filter(curso => {
                if (term) {
                    const matchNombre = (curso.nombre || '').toLowerCase().includes(term);
                    const matchDocente = (curso.profesor || '').toLowerCase().includes(term);
                    const matchGrado = `${curso.grado || ''} ${curso.seccion || ''} ${curso.nivel || ''}`.toLowerCase().includes(term);
                    if (!matchNombre && !matchDocente && !matchGrado) return false;
                }

                const totalSemanas = Number(curso.semanasTotales || curso.totalClases || TOTAL_SEMANAS_LECTIVAS);
                const progreso = clamp(Number(curso.progresoReal ?? 0), 0, 100);
                const esCompletado = totalSemanas > 0 && progreso >= 100;

                if (statusVal === 'completado' && !esCompletado) return false;
                if (statusVal === 'en-progreso' && esCompletado) return false;

                return true;
            });
        }

        async function loadCursos() {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = `<div class="course-loading"><img src="../icons/regular/spinner.svg" class="icon-img icon-spin" alt="spinner"><p>Cargando cursos desde la API...</p></div>`;

            let user = userCursos;
            if (!user?.id) {
                user = await window.shidellSession?.obtenerUsuario()
                    || JSON.parse(localStorage.getItem('shidell_user') || 'null')
                    || {};
            }

            if (!user?.id) {
                try {
                    const meRes = await fetch('/api/auth/me');
                    if (meRes.ok) user = await meRes.json();
                } catch(e) {}
            }

            try {
                let url = user?.id ? `/api/cursos/estudiante/${user.id}/detalle` : `/api/cursos`;
                const [response, tareasRes] = await Promise.all([
                    fetch(url),
                    user?.id ? fetch(`/api/tareas/estudiante/${user.id}`).catch(() => null) : Promise.resolve(null)
                ]);

                let finalRes = response;
                if (!finalRes.ok && user?.id) {
                    finalRes = await fetch(`/api/cursos`);
                }
                if (!finalRes.ok) throw new Error('Error al cargar cursos');

                const data = await finalRes.json();
                const tareasData = (tareasRes && tareasRes.ok) ? await tareasRes.json() : {};
                const tareasLista = Array.isArray(tareasData.tareas) ? tareasData.tareas : [];

                const lista = data.cursos || (Array.isArray(data) ? data : []);
                cursosDetalle = normalizarCursos(lista, tareasLista);

                renderCursos();
            } catch (error) {
                console.error('Error fetching courses:', error);
                grid.innerHTML = estadoVacio('ph-warning', 'No se pudieron cargar tus cursos.');
            }
        }

        function renderCursos() {
            const grid = document.getElementById('courses-grid');
            const count = document.getElementById('courses-count');
            const filtrados = obtenerCursosFiltrados();

            count.textContent = `${filtrados.length} ${filtrados.length === 1 ? 'curso' : 'cursos'}`;

            if (modoVista === 'lista') {
                grid.className = 'courses-list';
            } else {
                grid.className = 'courses-grid';
            }

            if (!cursosDetalle.length) {
                grid.innerHTML = estadoVacio('ph-books', 'No tienes cursos matriculados.');
                return;
            }

            if (!filtrados.length) {
                grid.innerHTML = estadoVacio('ph-magnifying-glass', 'No se encontraron cursos que coincidan con el filtro.');
                return;
            }

            if (modoVista === 'lista') {
                grid.innerHTML = filtrados.map(buildCursoRow).join('');
            } else {
                grid.innerHTML = filtrados.map(buildCursoCard).join('');
            }
        }

        function resolverTextoHorario(curso) {
            const hoy = new Date();
            const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
            const clases = Array.isArray(curso.clases) ? curso.clases : [];
            const siguiente = curso.proximaClase || clases.find(clase => String(clase.fecha).slice(0, 10) >= hoyStr) || clases[0] || null;

            if (siguiente && siguiente.fecha) {
                const rel = etiquetaRelativaFecha(siguiente.fecha);
                const fechaFmt = formatearFecha(siguiente.fecha);
                const horaStr = siguiente.hora || curso.horaInicio || '08:00';
                return rel ? `${rel} · ${horaStr}` : `${fechaFmt} · ${horaStr}`;
            }
            if (curso.diaSemana) {
                return `${nombreDia(curso.diaSemana)} · ${curso.horaInicio || '08:00'}${curso.horaFin ? ' - ' + curso.horaFin : ''}`;
            }
            return 'Horario pendiente';
        }

        function prepararDatosVisualesCurso(curso) {
            const color = colorCursoValido(curso.color);
            const totalSemanas = Number(curso.semanasTotales || curso.totalClases || TOTAL_SEMANAS_LECTIVAS);
            const semanasCompletadas = Number(curso.semanasCompletadas || 0);
            const semanasConActividades = Number(curso.semanasConActividades || 0);
            const totalTareas = Number(curso.tareasTotalesCurso || 0);
            const tareasCompletadas = Number(curso.tareasCompletadasCurso || 0);
            const forosAbiertos = Number(curso.forosAbiertosCurso || 0);
            const forosParticipados = Number(curso.forosParticipadosCurso || 0);
            const progreso = clamp(Number(curso.progresoReal ?? 0), 0, 100);

            const esCompletado = totalSemanas > 0 && (semanasCompletadas >= totalSemanas || progreso >= 100);
            const tieneAvanceParcial = semanasCompletadas > 0 || tareasCompletadas > 0 || forosParticipados > 0;
            const estadoCurso = esCompletado
                ? 'Completado'
                : (tieneAvanceParcial ? 'En progreso' : 'En curso');

            const etiquetaAvance = `Avance (${semanasCompletadas}/${totalSemanas} sem.)`;
            const detalleTooltip = `${semanasCompletadas} de ${totalSemanas} semanas completadas · ${semanasConActividades} con actividades (${tareasCompletadas}/${totalTareas} tareas, ${forosParticipados}/${forosAbiertos} foros)`;

            return {
                color,
                totalSemanas,
                semanasCompletadas,
                progreso,
                esCompletado,
                estadoCurso,
                etiquetaAvance,
                detalleTooltip,
                textoHorario: resolverTextoHorario(curso)
            };
        }

        function buildCursoRow(curso) {
            const v = prepararDatosVisualesCurso(curso);
            const infoNivelGrado = [
                curso.grado ? `${curso.grado}°` : '',
                curso.seccion ? `Sec. ${curso.seccion}` : '',
                curso.nivel ? curso.nivel : ''
            ].filter(Boolean).join(' · ');

            return `
                <article class="course-list-item" data-course-id="${escapeHtml(curso.id)}" tabindex="0" onclick="window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'}">
                    <div class="course-list-col-main">
                        <span class="course-icon bg-${v.color}-light" style="color:var(--${v.color});">
                            ${iconImg(escapeHtml(curso.icono || 'ph-book-open'), 'fill')}
                        </span>
                        <div class="course-list-title-group">
                            <div class="course-list-heading-line">
                                <h3 class="course-list-name">${escapeHtml(curso.nombre)}</h3>
                                <span class="course-status ${v.esCompletado ? 'status-completed' : ''}">${v.estadoCurso}</span>
                            </div>
                            <div class="course-list-subinfo">
                                <span class="course-list-teacher">
                                    <img src="../icons/regular/user.svg" class="icon-img" alt="docente">
                                    ${escapeHtml(curso.profesor || 'Docente Asignado')}
                                </span>
                                ${infoNivelGrado ? `<span class="course-badge-academic">${escapeHtml(infoNivelGrado)}</span>` : ''}
                            </div>
                        </div>
                    </div>

                    <div class="course-list-col-schedule">
                        <div class="meta-item">
                            <img src="../icons/regular/calendar-dots.svg" class="icon-img" alt="calendar-dots">
                            <span>${v.totalSemanas} semanas</span>
                        </div>
                        <div class="meta-item schedule-text" title="${escapeHtml(v.textoHorario)}">
                            <img src="../icons/regular/clock.svg" class="icon-img" alt="clock">
                            <span>${escapeHtml(v.textoHorario)}</span>
                        </div>
                    </div>

                    <div class="course-list-col-progress" title="${escapeHtml(v.detalleTooltip)}">
                        <div class="progress-row">
                            <span>${escapeHtml(v.etiquetaAvance)}</span>
                            <strong>${v.progreso}%</strong>
                        </div>
                        <div class="progress-track">
                            <span class="progress-fill bg-${v.color}" style="width:${v.progreso}%; background-color: var(--${v.color}, #2563eb);"></span>
                        </div>
                    </div>

                    <div class="course-list-col-action">
                        <a href="cursodetalleestudiante.html?id=${escapeHtml(curso.id)}" class="course-btn-link" onclick="event.stopPropagation();">
                            <span>Ver curso</span>
                            <img src="../icons/regular/arrow-right.svg" class="icon-img" alt="arrow-right">
                        </a>
                    </div>
                </article>`;
        }

        function buildCursoCard(curso) {
            const v = prepararDatosVisualesCurso(curso);

            return `
                <article class="course-card" data-course-id="${escapeHtml(curso.id)}" tabindex="0" onclick="window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'}">
                    <div class="course-card-top">
                        <span class="course-icon bg-${v.color}-light" style="color:var(--${v.color});">
                            ${iconImg(escapeHtml(curso.icono || 'ph-book-open'), 'fill')}
                        </span>
                        <span class="course-status ${v.esCompletado ? 'status-completed' : ''}">${v.estadoCurso}</span>
                    </div>
                    <h3>${escapeHtml(curso.nombre)}</h3>
                    <p>${escapeHtml(curso.profesor || 'Docente Asignado')}</p>
                    <div class="progress-row" title="${escapeHtml(v.detalleTooltip)}">
                        <span>${escapeHtml(v.etiquetaAvance)}</span>
                        <strong>${v.progreso}%</strong>
                    </div>
                    <div class="progress-track" title="${escapeHtml(v.detalleTooltip)}">
                        <span class="progress-fill bg-${v.color}" style="width:${v.progreso}%; background-color: var(--${v.color}, #2563eb);"></span>
                    </div>
                    <div class="course-meta-row">
                        <span><img src="../icons/regular/calendar-dots.svg" class="icon-img" alt="calendar-dots">${v.totalSemanas} semanas</span>
                        <span><img src="../icons/regular/clock.svg" class="icon-img" alt="clock">${escapeHtml(v.textoHorario)}</span>
                    </div>
                    <a href="cursodetalleestudiante.html?id=${escapeHtml(curso.id)}" class="course-card-link" onclick="event.stopPropagation();">Ver curso <img src="../icons/regular/arrow-right.svg" class="icon-img" alt="arrow-right"></a>
                </article>`;
        }

        function etiquetaRelativaFecha(fechaStr) {
            if (!fechaStr) return '';
            const hoy = new Date();
            const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
            const man = new Date();
            man.setDate(man.getDate() + 1);
            const manStr = `${man.getFullYear()}-${String(man.getMonth()+1).padStart(2,'0')}-${String(man.getDate()).padStart(2,'0')}`;
            const ayer = new Date();
            ayer.setDate(ayer.getDate() - 1);
            const ayerStr = `${ayer.getFullYear()}-${String(ayer.getMonth()+1).padStart(2,'0')}-${String(ayer.getDate()).padStart(2,'0')}`;

            const f = String(fechaStr).slice(0, 10);
            if (f === hoyStr) return 'Hoy';
            if (f === manStr) return 'Mañana';
            if (f === ayerStr) return 'Ayer';
            return '';
        }

        function nombreDia(dia) {
            const dias = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 7: 'Domingo' };
            return dias[Number(dia)] || 'Lunes';
        }

        function claveCurso(nombre) {
            return quitarAcentos(limpiarTexto(nombre || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        }

        function resolverSemanaDesdeFecha(fechaStr, clases) {
            if (!fechaStr) return 1;
            const f = String(fechaStr).slice(0, 10);
            const target = new Date(`${f}T12:00:00`);
            if (isNaN(target.getTime())) return 1;

            const ventanas = [];
            if (Array.isArray(clases) && clases.length > 0) {
                clases.forEach(cl => {
                    const iniStr = String(cl.fechaInicio || cl.fecha || '').slice(0, 10);
                    if (iniStr) {
                        const ini = new Date(`${iniStr}T00:00:00`);
                        const fin = new Date(ini);
                        fin.setDate(fin.getDate() + 6);
                        ventanas.push({ semana: Number(cl.semana || 1), ini, fin });
                    }
                });
            } else {
                const year = target.getFullYear();
                [`${year}-03-16`, `${year}-05-25`, `${year}-08-10`, `${year}-10-19`].forEach((bIni, bIdx) => {
                    const base = new Date(`${bIni}T00:00:00`);
                    for (let s = 0; s < 9; s++) {
                        const ini = new Date(base);
                        ini.setDate(ini.getDate() + s * 7);
                        const fin = new Date(ini);
                        fin.setDate(fin.getDate() + 6);
                        ventanas.push({ semana: bIdx * 9 + s + 1, ini, fin });
                    }
                });
            }

            let mejorSemana = 1;
            let menorDist = Infinity;
            for (const v of ventanas) {
                let dist = 0;
                if (target < v.ini) dist = v.ini - target;
                else if (target > v.fin) dist = target - v.fin;
                if (dist < menorDist) {
                    menorDist = dist;
                    mejorSemana = v.semana;
                }
            }
            return mejorSemana;
        }

        function calcularProgresoSemanalFallback(curso, tareasDelCurso, totalSemanas) {
            const clases = Array.isArray(curso.clases) ? curso.clases : [];
            const tareasPorSemana = new Map();

            tareasDelCurso.forEach(t => {
                const sem = t.semana && Number(t.semana) > 0
                    ? Number(t.semana)
                    : resolverSemanaDesdeFecha(t.fechaVencimiento || t.fechaInicio || t.fecha, clases);
                const semanaNorm = clamp(sem, 1, totalSemanas);
                if (!tareasPorSemana.has(semanaNorm)) tareasPorSemana.set(semanaNorm, []);
                tareasPorSemana.get(semanaNorm).push(t);
            });

            let semanasCompletadas = 0;
            tareasPorSemana.forEach(listaSemana => {
                if (listaSemana.length > 0 && listaSemana.every(t => t.entrega != null || t.status === 'Completada')) {
                    semanasCompletadas++;
                }
            });

            return {
                semanasConActividades: tareasPorSemana.size,
                semanasCompletadas,
                tareasTotales: tareasDelCurso.length,
                tareasCompletadas: tareasDelCurso.filter(t => t.entrega != null || t.status === 'Completada').length,
                progresoReal: clamp(Math.round((semanasCompletadas / Math.max(totalSemanas, 1)) * 100), 0, 100)
            };
        }

        function normalizarCursos(cursos, tareasLista = []) {
            const tareasNormalizadas = (Array.isArray(tareasLista) ? tareasLista : []).map(item => {
                if (item?.tarea) {
                    return {
                        ...item.tarea,
                        entrega: item.entrega || null,
                        status: item.status || item.tarea.estado
                    };
                }
                return item;
            });

            return cursos.map(curso => {
                let prof = curso.profesor;
                if (!prof && curso.docente) {
                    prof = `${curso.docente.nombres || ''} ${curso.docente.apellidos || ''}`.trim();
                }
                if (!prof && curso.profesorNombres) {
                    prof = `${curso.profesorNombres} ${curso.profesorApellidos || ''}`.trim();
                }
                if (!prof) prof = 'Docente Asignado';

                const nombreLimpio = limpiarTexto(curso.nombre || 'Curso');
                const keyCurso = claveCurso(nombreLimpio);

                const tareasDelCurso = tareasNormalizadas.filter(t => {
                    if (!t) return false;
                    if (t.curso?.id && curso.id && String(t.curso.id) === String(curso.id)) return true;
                    const keyTareaCurso = claveCurso(t.curso?.nombre || t.cursoNombre || '');
                    return keyCurso && keyTareaCurso === keyCurso;
                });

                const totalSemanas = Number(curso.semanasTotales || curso.totalClases || curso.clases?.length || TOTAL_SEMANAS_LECTIVAS);
                const vieneResumenBackend = curso.semanasCompletadas !== undefined && curso.semanasCompletadas !== null;
                const fallback = vieneResumenBackend ? null : calcularProgresoSemanalFallback(curso, tareasDelCurso, totalSemanas);

                const semanasCompletadas = vieneResumenBackend ? Number(curso.semanasCompletadas || 0) : fallback.semanasCompletadas;
                const semanasConActividades = vieneResumenBackend ? Number(curso.semanasConActividades || 0) : fallback.semanasConActividades;
                const totalTareas = vieneResumenBackend ? Number(curso.tareasTotalesCurso ?? tareasDelCurso.length) : fallback.tareasTotales;
                const tareasCompletadas = vieneResumenBackend ? Number(curso.tareasCompletadasCurso ?? 0) : fallback.tareasCompletadas;
                const forosAbiertos = Number(curso.forosAbiertosCurso || 0);
                const forosParticipados = Number(curso.forosParticipadosCurso || 0);
                const progresoReal = vieneResumenBackend
                    ? clamp(Number(curso.progresoClases ?? Math.round((semanasCompletadas / Math.max(totalSemanas, 1)) * 100)), 0, 100)
                    : fallback.progresoReal;

                return {
                    ...curso,
                    nombre: nombreLimpio,
                    profesor: limpiarTexto(prof),
                    clases: Array.isArray(curso.clases) ? curso.clases : [],
                    totalClases: totalSemanas,
                    semanasTotales: totalSemanas,
                    semanasConActividades,
                    semanasCompletadas,
                    tareasTotalesCurso: totalTareas,
                    tareasCompletadasCurso: tareasCompletadas,
                    forosAbiertosCurso: forosAbiertos,
                    forosParticipadosCurso: forosParticipados,
                    progresoReal
                };
            });
        }

        function estadoVacio(icono, texto) {
            return `<div class="course-empty">${iconImg(icono)}<p>${escapeHtml(texto)}</p></div>`;
        }

        function formatearFecha(fecha) {
            if (!fecha) return 'Sin fecha';
            try {
                if (Array.isArray(fecha)) {
                    const [y, m, d] = fecha;
                    const date = new Date(y, m - 1, d);
                    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
                    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
                    return `${dias[date.getDay()]}, ${d.toString().padStart(2, '0')} ${meses[date.getMonth()]}`;
                }
                const str = String(fecha).trim();
                const match = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                if (match) {
                    const year = parseInt(match[1], 10);
                    const month = parseInt(match[2], 10);
                    const day = parseInt(match[3], 10);
                    const date = new Date(year, month - 1, day);
                    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
                    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
                    return `${dias[date.getDay()]}, ${day.toString().padStart(2, '0')} ${meses[date.getMonth()]}`;
                }
                const d = new Date(str);
                return isNaN(d.getTime()) ? str : d.toLocaleDateString('es-PE', { weekday: 'short', day: '2-digit', month: 'short' });
            } catch (e) {
                return String(fecha);
            }
        }

        function colorCursoValido(color) {
            if (!color) return 'blue';
            const c = String(color).toLowerCase();
            if (['purple', 'green', 'blue', 'yellow', 'orange', 'red', 'teal', 'indigo'].includes(c)) return c;
            if (c.includes('3b82f6')) return 'blue';
            if (c.includes('8b5cf6')) return 'purple';
            if (c.includes('10b981')) return 'green';
            if (c.includes('f59e0b')) return 'yellow';
            if (c.includes('ef4444') || c.includes('f43f5e')) return 'red';
            if (c.includes('14b8a6')) return 'teal';
            if (c.includes('6366f1')) return 'indigo';
            if (c.includes('ec4899')) return 'purple';
            return 'blue';
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function quitarAcentos(texto) {
            return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function limpiarTexto(texto) {
            let valor = String(texto || '');
            for (let i = 0; i < 3 && /[\u00C3\u00C2]/.test(valor); i++) {
                try {
                    const decodificado = decodeURIComponent(escape(valor));
                    if (decodificado === valor) break;
                    valor = decodificado;
                } catch (error) {
                    break;
                }
            }
            return valor;
        }

        function escapeHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char] || char);
        }
    </script>
