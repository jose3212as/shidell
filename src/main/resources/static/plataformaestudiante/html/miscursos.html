        <!-- Main Wrapper -->
        <main class="main-wrapper courses-shell">

            <div class="content-area courses-page">
                <section class="courses-layout">

    <!-- Script Logic -->
    <script>
        let userCursos = {};
        const TOTAL_SEMANAS_LECTIVAS = 36;
        let cursosDetalle = [];

        document.addEventListener('DOMContentLoaded', async () => {
            userCursos = await window.shidellSession?.obtenerUsuario() 
                || JSON.parse(localStorage.getItem('shidell_user') || 'null') 
                || {};

            document.querySelectorAll('.user-name').forEach(el => {
                el.textContent = `${userCursos.nombres || ''} ${userCursos.apellidos || ''}`.trim() || 'Estudiante';
            });

            await loadCursos();
        });

        async function loadCursos() {
            const grid = document.getElementById('courses-grid');
            grid.innerHTML = `<div class="course-loading"><img src="../icons/regular/spinner.svg" class="icon-img icon-spin" alt="spinner"><p>Cargando cursos desde la API...</p></div>`;

            let user = userCursos;
            if (!user?.id) {
                user = await window.shidellSession?.obtenerUsuario()
                    || JSON.parse(localStorage.getItem('shidell_user') || 'null')
                    || {};
            }

            if (!user?.id) {
                try {
                    const meRes = await fetch('/api/auth/me');
                    if (meRes.ok) user = await meRes.json();
                } catch(e) {}
            }

            try {
                let url = user?.id ? `/api/cursos/estudiante/${user.id}/detalle` : `/api/cursos`;
                const [response, tareasRes] = await Promise.all([
                    fetch(url),
                    user?.id ? fetch(`/api/tareas/estudiante/${user.id}`).catch(() => null) : Promise.resolve(null)
                ]);

                let finalRes = response;
                if (!finalRes.ok && user?.id) {
                    finalRes = await fetch(`/api/cursos`);
                }
                if (!finalRes.ok) throw new Error('Error al cargar cursos');

                const data = await finalRes.json();
                const tareasData = (tareasRes && tareasRes.ok) ? await tareasRes.json() : {};
                const tareasLista = Array.isArray(tareasData.tareas) ? tareasData.tareas : [];

                const lista = data.cursos || (Array.isArray(data) ? data : []);
                cursosDetalle = normalizarCursos(lista, tareasLista);

                renderCursos();
            } catch (error) {
                console.error('Error fetching courses:', error);
                grid.innerHTML = estadoVacio('ph-warning', 'No se pudieron cargar tus cursos.');
            }
        }

        function renderCursos() {
            const grid = document.getElementById('courses-grid');
            const count = document.getElementById('courses-count');

            count.textContent = `${cursosDetalle.length} ${cursosDetalle.length === 1 ? 'curso' : 'cursos'}`;

            if (!cursosDetalle.length) {
                grid.innerHTML = estadoVacio('ph-books', 'No tienes cursos matriculados.');
                return;
            }

            grid.innerHTML = cursosDetalle.map(buildCursoCard).join('');
        }

        function buildCursoCard(curso) {
            const color = colorCursoValido(curso.color);
            const totalTareas = Number(curso.tareasTotalesCurso || 0);
            const tareasCompletadas = Number(curso.tareasCompletadasCurso || 0);
            const progreso = clamp(Number(curso.progresoReal ?? 0), 0, 100);
            
            const hoy = new Date();
            const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
            const clases = Array.isArray(curso.clases) ? curso.clases : [];
            
            // Próxima sesión: primera sesión desde hoy en adelante
            let siguiente = curso.proximaClase || clases.find(clase => String(clase.fecha).slice(0, 10) >= hoyStr) || clases[0] || null;

            let textoHorario = 'Horario pendiente';
            if (siguiente && siguiente.fecha) {
                const rel = etiquetaRelativaFecha(siguiente.fecha);
                const fechaFmt = formatearFecha(siguiente.fecha);
                const horaStr = siguiente.hora || curso.horaInicio || '08:00';
                textoHorario = rel ? `${rel} · ${horaStr}` : `${fechaFmt} · ${horaStr}`;
            } else if (curso.diaSemana) {
                textoHorario = `${nombreDia(curso.diaSemana)} · ${curso.horaInicio || '08:00'}${curso.horaFin ? ' - ' + curso.horaFin : ''}`;
            }

            const etiquetaAvance = totalTareas > 0
                ? `Avance (${tareasCompletadas}/${totalTareas} ${totalTareas === 1 ? 'tarea' : 'tareas'})`
                : 'Avance (0 tareas)';
            const estadoCurso = (totalTareas > 0 && progreso >= 100)
                ? 'Completado'
                : (tareasCompletadas > 0 ? 'En progreso' : 'En curso');

            return `
                <article class="course-card" data-course-id="${escapeHtml(curso.id)}" tabindex="0" onclick="window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'" onkeydown="if(event.key==='Enter'||event.key===' '){event.preventDefault();window.location.href='cursodetalleestudiante.html?id=${escapeHtml(curso.id)}'}">
                    <div class="course-card-top">
                        <span class="course-icon bg-${color}-light" style="color:var(--${color});">
                            ${iconImg(escapeHtml(curso.icono || 'ph-book-open'), 'fill')}
                        </span>
                        <span class="course-status">${estadoCurso}</span>
                    </div>
                    <h3>${escapeHtml(curso.nombre)}</h3>
                    <p>${escapeHtml(curso.profesor || 'Docente Asignado')}</p>
                    <div class="progress-row">
                        <span>${escapeHtml(etiquetaAvance)}</span>
                        <strong>${progreso}%</strong>
                    </div>
                    <div class="progress-track">
                        <span class="progress-fill bg-${color}" style="width:${progreso}%; background-color: var(--${color}, #2563eb);"></span>
                    </div>
                    <div class="course-meta-row">
                        <span><img src="../icons/regular/calendar-dots.svg" class="icon-img" alt="calendar-dots">${curso.totalClases || TOTAL_SEMANAS_LECTIVAS} semanas</span>
                        <span><img src="../icons/regular/clock.svg" class="icon-img" alt="clock">${escapeHtml(textoHorario)}</span>
                    </div>
                    <a href="cursodetalleestudiante.html?id=${escapeHtml(curso.id)}" class="course-card-link" onclick="event.stopPropagation();">Ver curso <img src="../icons/regular/arrow-right.svg" class="icon-img" alt="arrow-right"></a>
                </article>`;
        }

        function etiquetaRelativaFecha(fechaStr) {
            if (!fechaStr) return '';
            const hoy = new Date();
            const hoyStr = `${hoy.getFullYear()}-${String(hoy.getMonth()+1).padStart(2,'0')}-${String(hoy.getDate()).padStart(2,'0')}`;
            const man = new Date();
            man.setDate(man.getDate() + 1);
            const manStr = `${man.getFullYear()}-${String(man.getMonth()+1).padStart(2,'0')}-${String(man.getDate()).padStart(2,'0')}`;
            const ayer = new Date();
            ayer.setDate(ayer.getDate() - 1);
            const ayerStr = `${ayer.getFullYear()}-${String(ayer.getMonth()+1).padStart(2,'0')}-${String(ayer.getDate()).padStart(2,'0')}`;

            const f = String(fechaStr).slice(0, 10);
            if (f === hoyStr) return 'Hoy';
            if (f === manStr) return 'Mañana';
            if (f === ayerStr) return 'Ayer';
            return '';
        }

        function nombreDia(dia) {
            const dias = { 1: 'Lunes', 2: 'Martes', 3: 'Miércoles', 4: 'Jueves', 5: 'Viernes', 6: 'Sábado', 7: 'Domingo' };
            return dias[Number(dia)] || 'Lunes';
        }

        function claveCurso(nombre) {
            return quitarAcentos(limpiarTexto(nombre || '')).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
        }

        function normalizarCursos(cursos, tareasLista = []) {
            const tareasNormalizadas = (Array.isArray(tareasLista) ? tareasLista : []).map(item => {
                if (item?.tarea) {
                    return {
                        ...item.tarea,
                        entrega: item.entrega || null,
                        status: item.status || item.tarea.estado
                    };
                }
                return item;
            });

            return cursos.map(curso => {
                let prof = curso.profesor;
                if (!prof && curso.docente) {
                    prof = `${curso.docente.nombres || ''} ${curso.docente.apellidos || ''}`.trim();
                }
                if (!prof && curso.profesorNombres) {
                    prof = `${curso.profesorNombres} ${curso.profesorApellidos || ''}`.trim();
                }
                if (!prof) prof = 'Docente Asignado';

                const nombreLimpio = limpiarTexto(curso.nombre || 'Curso');
                const keyCurso = claveCurso(nombreLimpio);

                const tareasDelCurso = tareasNormalizadas.filter(t => {
                    if (!t) return false;
                    if (t.curso?.id && curso.id && String(t.curso.id) === String(curso.id)) return true;
                    const keyTareaCurso = claveCurso(t.curso?.nombre || t.cursoNombre || '');
                    return keyCurso && keyTareaCurso === keyCurso;
                });

                const totalTareas = tareasDelCurso.length;
                const tareasCompletadas = tareasDelCurso.filter(t => t.entrega != null || t.status === 'Completada').length;
                const progresoReal = totalTareas > 0 ? Math.round((tareasCompletadas / totalTareas) * 100) : 0;

                return {
                    ...curso,
                    nombre: nombreLimpio,
                    profesor: limpiarTexto(prof),
                    clases: Array.isArray(curso.clases) ? curso.clases : [],
                    totalClases: Number(curso.totalClases || curso.clases?.length || TOTAL_SEMANAS_LECTIVAS),
                    tareasTotalesCurso: totalTareas,
                    tareasCompletadasCurso: tareasCompletadas,
                    progresoReal
                };
            });
        }

        function estadoVacio(icono, texto) {
            return `<div class="course-empty">${iconImg(icono)}<p>${escapeHtml(texto)}</p></div>`;
        }

        function formatearFecha(fecha) {
            if (!fecha) return 'Sin fecha';
            try {
                if (Array.isArray(fecha)) {
                    const [y, m, d] = fecha;
                    const date = new Date(y, m - 1, d);
                    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
                    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
                    return `${dias[date.getDay()]}, ${d.toString().padStart(2, '0')} ${meses[date.getMonth()]}`;
                }
                const str = String(fecha).trim();
                const match = str.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);
                if (match) {
                    const year = parseInt(match[1], 10);
                    const month = parseInt(match[2], 10);
                    const day = parseInt(match[3], 10);
                    const date = new Date(year, month - 1, day);
                    const meses = ['ene', 'feb', 'mar', 'abr', 'may', 'jun', 'jul', 'ago', 'set', 'oct', 'nov', 'dic'];
                    const dias = ['dom', 'lun', 'mar', 'mié', 'jue', 'vie', 'sáb'];
                    return `${dias[date.getDay()]}, ${day.toString().padStart(2, '0')} ${meses[date.getMonth()]}`;
                }
                const d = new Date(str);
                return isNaN(d.getTime()) ? str : d.toLocaleDateString('es-PE', { weekday: 'short', day: '2-digit', month: 'short' });
            } catch (e) {
                return String(fecha);
            }
        }

        function colorCursoValido(color) {
            if (!color) return 'blue';
            const c = String(color).toLowerCase();
            if (['purple', 'green', 'blue', 'yellow', 'orange', 'red', 'teal', 'indigo'].includes(c)) return c;
            if (c.includes('3b82f6')) return 'blue';
            if (c.includes('8b5cf6')) return 'purple';
            if (c.includes('10b981')) return 'green';
            if (c.includes('f59e0b')) return 'yellow';
            if (c.includes('ef4444') || c.includes('f43f5e')) return 'red';
            if (c.includes('14b8a6')) return 'teal';
            if (c.includes('6366f1')) return 'indigo';
            if (c.includes('ec4899')) return 'purple';
            return 'blue';
        }

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function quitarAcentos(texto) {
            return String(texto || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '');
        }

        function limpiarTexto(texto) {
            let valor = String(texto || '');
            for (let i = 0; i < 3 && /[\u00C3\u00C2]/.test(valor); i++) {
                try {
                    const decodificado = decodeURIComponent(escape(valor));
                    if (decodificado === valor) break;
                    valor = decodificado;
                } catch (error) {
                    break;
                }
            }
            return valor;
        }

        function escapeHtml(valor) {
            return String(valor ?? '').replace(/[&<>"']/g, char => ({
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#39;'
            })[char] || char);
        }
    </script>
