<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="/vendor/shidell-theme.js?v=20261114d"></script>
    <title>Shidell - Mis Tareas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=JetBrains+Mono:wght@400;500;600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="../js/session-api.js?v=apiestudiante20260512i"></script>
    <script src="../js/icon-helper.js"></script>
    <link rel="stylesheet" href="../css/styles.css?v=20261114s">
    <link rel="stylesheet" href="../css/tareas.css?v=20261114c">
    <link rel="stylesheet" href="../css/tareas-page.css">
</head>

<body>
    <div class="dashboard">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <div class="logo-icon"><img src="../icons/fill/graduation-cap.svg" class="icon-img" alt="graduation-cap"></div>
                <div class="logo-text">
                    <h2>Shidell</h2>
                    <p>Portal Estudiante</p>
                </div>
            </div>

            <nav class="sidebar-nav">
                <a href="portalestudiante.html" class="nav-item">
                    <img src="../icons/regular/house.svg" class="icon-img" alt="house">
                    <span>Inicio</span>
                </a>
                <a href="miscursos.html" class="nav-item">
                    <img src="../icons/regular/book-open.svg" class="icon-img" alt="book-open">
                    <span>Mis cursos</span>
                </a>
                <a href="tareas.html" class="nav-item active">
                    <img src="../icons/regular/clipboard-text.svg" class="icon-img" alt="clipboard-text">
                    <span>Tareas</span>
                </a>
                <a href="calificaciones.html" class="nav-item">
                    <img src="../icons/regular/star.svg" class="icon-img" alt="star">
                    <span>Calificaciones</span>
                </a>
                <a href="calendario.html" class="nav-item">
                    <img src="../icons/regular/calendar-blank.svg" class="icon-img" alt="calendar-blank">
                    <span>Calendario</span>
                </a>
                <a href="mensajes.html" class="nav-item">
                    <img src="../icons/regular/chat-circle-dots.svg" class="icon-img" alt="chat-circle-dots">
                    <span>Mensajes</span>
                </a>
                <a href="miprogreso.html" class="nav-item">
                    <img src="../icons/regular/shield-check.svg" class="icon-img" alt="shield-check">
                    <span>Mi progreso</span>
                </a>
                <a href="configuracion.html" class="nav-item">
                    <img src="../icons/regular/gear.svg" class="icon-img" alt="gear">
                    <span>Configuración</span>
                </a>
            </nav>
        </aside>

        <!-- Main Content -->
        <main class="main-wrapper">
            <!-- Topbar -->
            <header class="topbar">
                <div class="greeting">
                    <h1>¡Hola, Estudiante! 👋</h1>
                    <p id="user-academic-info">Cargando información académica...</p>
                </div>

                <div class="topbar-actions">

                    <button class="notification-btn">
                        <img src="../icons/regular/bell.svg" class="icon-img" alt="bell">
                        <span class="badge"></span>
                    </button>

                    <div class="top-user-info">
                        <div class="user-details">
                            <span class="user-name">Estudiante</span>
                            <a href="configuracion.html" style="text-decoration:none;"><span class="user-action">Ver perfil <img src="../icons/regular/caret-right.svg" class="icon-img" alt="caret-right"></span></a>
                        </div>
                        <div class="avatar"><img src="../icons/fill/user.svg" class="icon-img" alt="user" style="width: 24px; height: 24px;"></div>
                    </div>
                </div>
            </header>

            <!-- Content Area -->
            <div class="content-area">

                <div class="tareas-header">
                    <h2>Mis Tareas</h2>
                    <div class="tareas-toolbar">
                        <div class="tareas-tabs">
                            <button class="tarea-tab active" data-status="Todas">Todas <span class="count" id="count-todas">0</span></button>
                            <button class="tarea-tab" data-status="Pendiente">Pendientes <span class="count" id="count-pendiente">0</span></button>
                            <button class="tarea-tab" data-status="Vencido">Vencidas <span class="count" id="count-vencido">0</span></button>
                            <button class="tarea-tab" data-status="Completada">Completadas <span class="count" id="count-completada">0</span></button>
                        </div>
                        <div style="position:relative;">
                            <button class="btn-filter" id="btnFiltroTareas"><img src="../icons/regular/faders.svg" class="icon-img" alt="faders"> Filtros <img src="../icons/regular/caret-down.svg" class="icon-img" alt="caret-down"></button>
                            <div id="filtroTareasMenu" style="display:none;position:absolute;right:0;top:40px;background:white;border:1px solid var(--border);border-radius:10px;padding:12px;z-index:100;min-width:150px;box-shadow:0 8px 24px rgba(0,0,0,.12);">
                                <p style="font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:6px;text-transform:uppercase;">Prioridad</p>
                                <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;"><input type="radio" name="prio" value="" checked> Todas</label>
                                <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;"><input type="radio" name="prio" value="Alta"> Alta ↑</label>
                                <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;"><input type="radio" name="prio" value="Media"> Media —</label>
                                <label style="display:flex;align-items:center;gap:8px;padding:4px 0;cursor:pointer;font-size:13px;"><input type="radio" name="prio" value="Baja"> Baja ↓</label>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="tareas-layout">
                    <!-- Left Column: Tasks List -->
                    <div class="tareas-list-column">
                        <div class="tareas-list-section">
                            <div id="tareasContainer">
                                <!-- Spinner inicial -->
                                <div style="padding: 40px; text-align: center; color: var(--text-muted);">
                                    <img src="../icons/regular/spinner.svg" class="icon-img icon-spin" alt="spinner" style="width: 32px; height: 32px; display: block; margin-bottom: 10px; animation: spin 1s linear infinite;">
                                    <p>Cargando tus tareas...</p>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <!-- Modal Boleta Oficial de Entrega (renderizado por comprobante-modal.js) -->
    <div id="comprobanteOverlay" class="comprobante-overlay" aria-hidden="true"></div>

    <script src="../js/comprobante-modal.js?v=20261114c"></script>
    <script src="../js/tareas.js?v=20261114b"></script>
<script src="../js/app.js?v=apiestudiante20260512i"></script>
<script src="../js/notificaciones.js?v=20261114s"></script>


    <!-- SweetAlert2 para Alertas Elegantes -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="/vendor/alertas.js?v=20261019d"></script>

</body>
</html>
